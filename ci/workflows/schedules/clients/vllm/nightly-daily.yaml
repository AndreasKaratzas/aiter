name: Schedule client-vllm-nightly daily

on:
  schedule:
    - cron: '45 17 * * *'

# Preserve the token scopes already declared by the called jobs.
permissions:
  actions: read
  contents: read

jobs:
  run:
    uses: ./.github/workflows/client-vllm-nightly.yaml
    with:
      workload_profile: 'vllm-nightly'
    secrets: inherit
