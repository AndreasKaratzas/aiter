name: Rolling framework canaries

on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

# These results are diagnostic. Supported PR/nightly cells use AITER_SUPPORT_PROFILES.
jobs:
  resolve:
    runs-on: build-only-aiter
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: resolve
        name: Freeze each upstream canary image and observe its actual dependencies
        env:
          CANARY_IMAGES: ${{ vars.AITER_CANARY_IMAGES }}
        run: python3 -m ci.pipelines canary-environments --controls "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/canary-resolution"
      - name: Retain resolved images, dependency observations and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-environments
          path: |
            ${{ runner.temp }}/canary-resolution
            !${{ runner.temp }}/canary-resolution/suite/**
          retention-days: 90
          if-no-files-found: error

  execute:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    uses: ./.github/workflows/product-run-profile.yaml
    with:
      profile: ${{ matrix.profile }}
      image: ${{ matrix.image }}
      environment_lock: ${{ matrix.environment_lock }}
      label: ${{ matrix.label }}
      architecture: gfx950
      gpus: '0,1'
