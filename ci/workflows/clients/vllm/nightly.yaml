name: Install and qualify the current ROCm vLLM nightly

on:
  schedule:
    - cron: '45 17 * * *'
    - cron: '15 20 * * 0'
  workflow_dispatch:
    inputs:
      workload_profile:
        description: Required daily or extended feature scope
        type: choice
        options: [vllm-nightly, vllm-extended]
        default: vllm-nightly

permissions:
  contents: read
  actions: read

# Rolling installation evidence is advisory and never advances a supported channel.
jobs:
  build:
    uses: ./.github/workflows/release-build-wheels.yaml
    with:
      release_type: none
      docker_image_py310: ${{ vars.AITER_VLLM_NIGHTLY_EXECUTOR }}
      docker_image_py312: ${{ vars.AITER_VLLM_NIGHTLY_EXECUTOR }}
      build_py310: false
      build_py312: true
      gpu_archs: gfx950
      runner: build-only-aiter
      add_date_stamp: true

  qualify:
    needs: build
    runs-on: linux-aiter-do-mi350x-8
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}/control
    defaults:
      run:
        working-directory: control
    steps:
      # control/ holds reviewed build/test instructions; candidate/ identifies AITER being evaluated.
      # They may differ so candidate changes cannot replace the rules that evaluate them.
      - name: Checkout test and benchmark instructions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Checkout the AITER version to evaluate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: candidate
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: aiter-whl-packages-py3.12*
          path: dist
          merge-multiple: true
      - name: Resolve nightly, install consumer then candidate, gate imports and run workloads
        env:
          EXECUTOR_IMAGE: ${{ vars.AITER_VLLM_NIGHTLY_EXECUTOR }}
          WORKLOAD_PROFILE: ${{ inputs.workload_profile || (github.event.schedule == '15 20 * * 0' && 'vllm-extended' || 'vllm-nightly') }}
        run: |
          python3 -m ci.pipelines vllm-nightly \
            --source "$GITHUB_WORKSPACE/candidate" --controls "$GITHUB_WORKSPACE/control" \
            --wheel-dir "$GITHUB_WORKSPACE/dist" --output "$RUNNER_TEMP/vllm-nightly" \
            --image "$EXECUTOR_IMAGE" --gpus 0,1 --workload-profile "$WORKLOAD_PROFILE"
      - name: Retain installation failures and all qualification attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vllm-nightly-installation-and-qualification
          path: |
            ${{ runner.temp }}/vllm-nightly
            !${{ runner.temp }}/vllm-nightly/**/cache/**
            !${{ runner.temp }}/vllm-nightly/**/suite/**
          retention-days: 90
          if-no-files-found: error
