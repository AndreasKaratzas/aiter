name: Bootstrap and run a declared pipeline

on:
  workflow_call:
    inputs:
      pipeline:
        description: profile, vllm-nightly or vllm-benchmark; execution is owned by the Python runner
        type: string
        default: profile
      benchmark_cases:
        description: Optional exact benchmark case subset
        type: string
        default: ''
      artifact_pattern:
        type: string
        default: aiter-whl-packages-py*
      timeout_minutes:
        type: number
        default: 360
      mode:
        description: Source or installed-wheel qualification
        type: string
        default: source
      wheel:
        type: string
        default: ''
      base_revision:
        description: Full PR base SHA; absent or unknown means the entire profile
        type: string
        default: ''
      environment_lock:
        description: Required for locked qualification; rolling installers observe their environment
        type: string
        default: ''
      architecture:
        type: string
        default: gfx950
      label:
        type: string
        required: true
      source_revision:
        type: string
        default: ''
      profile:
        description: Reviewed test profile or benchmark profile to execute
        type: string
        required: true
      image:
        description: Executor image; resolved to an immutable local image before execution
        type: string
        required: true
      gpus:
        description: Visible GPU indices inside the worker allocation
        type: string
        default: '0,1'
      runner:
        type: string
        default: linux-aiter-do-mi350x-8

permissions:
  contents: read
  actions: read

jobs:
  execute:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      PYTHONPATH: ${{ github.workspace }}/control
    defaults:
      run:
        working-directory: control
    steps:
      - name: Checkout reviewed execution controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Checkout candidate source without executing its host helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          path: candidate
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Download the immutable candidate wheel
        if: inputs.mode == 'wheel' || inputs.pipeline != 'profile'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ inputs.artifact_pattern }}
          path: dist
          merge-multiple: true
      - name: Bootstrap the selected pipeline from reviewed instructions
        env:
          PIPELINE_OPERATION: ${{ inputs.pipeline }}
          PIPELINE_MODE: ${{ inputs.mode }}
          PIPELINE_WHEEL: ${{ inputs.wheel }}
          PIPELINE_ARTIFACTS: ${{ github.workspace }}/dist
          PIPELINE_IMAGE: ${{ inputs.image }}
          PIPELINE_ENVIRONMENT_LOCK: ${{ inputs.environment_lock }}
          PIPELINE_PROFILE: ${{ inputs.profile }}
          PIPELINE_GPUS: ${{ inputs.gpus }}
          PIPELINE_ARCHITECTURE: ${{ inputs.architecture }}
          PIPELINE_BASE_REVISION: ${{ inputs.base_revision }}
          PIPELINE_SOURCE_REVISION: ${{ inputs.source_revision || github.sha }}
          PIPELINE_BENCHMARK_CASES: ${{ inputs.benchmark_cases }}
        run: python3 -S -m ci.pipelines.bootstrap
      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.pipeline != 'profile' && 'advisory' || (inputs.mode == 'wheel' && 'support-evidence' || 'qualification') }}-${{ inputs.label }}
          path: |
            ${{ runner.temp }}/qualification
            !${{ runner.temp }}/qualification/**/cache/**
            !${{ runner.temp }}/qualification/**/suite/**
          retention-days: 90
          if-no-files-found: error
