name: vLLM latency canary

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VLLM_BRANCH: "main"
  VLLM_REPOSITORY_URL: "https://github.com/vllm-project/vllm"
  BASE_IMAGE: rocm/vllm-dev:nightly
  DOCKER_PULL_MAX_ATTEMPTS: "3"
  DOCKER_PULL_RETRY_DELAY_SECONDS: "10"
  AITER_WHEEL_ARTIFACT_NAME: aiter-vllm-whl-${{ github.run_id }}
  GITHUB_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/ROCm/aiter.git' }}
  GITHUB_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  ci_config:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'ci:vllm') ||
      contains(github.event.pull_request.labels.*.name, 'ci:all')))
    uses: ./.github/workflows/repository-legacy-config.yaml

  check-signal:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'ci:vllm') ||
      contains(github.event.pull_request.labels.*.name, 'ci:all')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Checks workflow
        run: ./.github/scripts/common/check_signal.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}

  build_aiter_wheel:
    name: Build Aiter wheel
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'ci:vllm') ||
      contains(github.event.pull_request.labels.*.name, 'ci:all')))
    needs: [check-signal, ci_config]
    runs-on: build-only-aiter
    steps:
      - name: Checkout aiter repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Sync submodules
        run: |
          set -e
          git submodule sync
          git submodule update --init --recursive --depth 1 --jobs 4

      - name: Docker login
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        env:
          DOCKER_USERNAME: ${{ secrets[needs.ci_config.outputs.docker_username_secret] }}
          DOCKER_PASSWORD: ${{ secrets[needs.ci_config.outputs.docker_password_secret] }}
        run: |
          for attempt in 1 2 3; do
            if echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin; then
              echo "Docker login succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Docker login attempt ${attempt} failed"
            if [ "${attempt}" != 3 ]; then
              sleep 10
            fi
          done
          echo "Docker login failed after 3 attempts, continuing anyway"
          exit 0

      - name: Build Aiter wheel in vLLM base image
        run: |
          set -euo pipefail
          bash .github/scripts/common/docker_pull.sh "${{ env.BASE_IMAGE }}"
          docker run --rm \
            --network=host \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e AITER_USE_SYSTEM_TRITON=1 \
            ${{ env.BASE_IMAGE }} \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /workspace
              shopt -s nullglob
              rm -rf dist build aiter_meta ./*.egg-info
              pip uninstall -y aiter amd-aiter || true
              pip config set global.default-timeout 60
              pip config set global.retries 10
              pip install -r requirements/test/product.txt
              pip install --upgrade -r requirements/test/legacy-overrides.txt
              pip install --upgrade -r requirements/build/legacy.txt
              python setup.py bdist_wheel
              ls -lh dist/*.whl
            '

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AITER_WHEEL_ARTIFACT_NAME }}
          path: dist/*.whl
          retention-days: 14

  select-tests:
    name: Select declared vLLM latency cases
    needs: [check-signal]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read client case manifest
        id: select
        run: python3 -m ci.clients.manifest --client vllm

  vllm_benchmark:
    name: vLLM Benchmark
    timeout-minutes: 60
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'ci:vllm') ||
      contains(github.event.pull_request.labels.*.name, 'ci:all')))
    needs: [build_aiter_wheel, ci_config, select-tests]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select-tests.outputs.matrix) }}

    steps:
      - name: Checkout reviewed model execution controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false

      - name: Download Aiter wheel artifact
        uses: actions/download-artifact@v4
        timeout-minutes: 30
        with:
          name: ${{ env.AITER_WHEEL_ARTIFACT_NAME }}
          path: aiter_wheels

      - name: Docker login
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        env:
          DOCKER_USERNAME: ${{ secrets[needs.ci_config.outputs.docker_username_secret] }}
          DOCKER_PASSWORD: ${{ secrets[needs.ci_config.outputs.docker_password_secret] }}
        run: |
          for attempt in 1 2 3; do
            if echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin; then
              echo "Docker login succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Docker login attempt ${attempt} failed"
            if [ "${attempt}" != 3 ]; then
              sleep 10
            fi
          done
          echo "Docker login failed after 3 attempts, continuing anyway"
          exit 0

      - name: Run the declared latency canary
        env:
          PYTHONPATH: ${{ github.workspace }}/control
          TEST_SPEC: ${{ toJson(matrix) }}
          HF_TOKEN: ${{ secrets.HF_TOKEN_TEST }}
        working-directory: control
        run: |
          python3 -m ci.pipelines canary --client vllm --case-json "$TEST_SPEC" \
            --controls "$GITHUB_WORKSPACE/control" --wheel-dir "$GITHUB_WORKSPACE/aiter_wheels" \
            --image "$BASE_IMAGE" --output "$RUNNER_TEMP/vllm-canary"

      - name: Retain model command, image, wheel and measurement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vllm-latency-${{ strategy.job-index }}
          path: ${{ runner.temp }}/vllm-canary
          if-no-files-found: error
          retention-days: 14
