name: Documentation

on:
  push:
    branches:
      - main
      - docs-website
      - akaratza_aiter_implementation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/docs/browser.txt
          python -m playwright install --with-deps chromium

      - name: Test website generation and navigation checks
        run: python -m unittest discover -s docs/website/tests -v

      - name: Build the website with local link validation
        run: python -m docs.website build --output "$RUNNER_TEMP/aiter-site"

      - name: Inspect every page in Chromium and exercise navigation
        run: python -m docs.website check --site "$RUNNER_TEMP/aiter-site" --output "$RUNNER_TEMP/aiter-site-check"

      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-browser-evidence
          path: ${{ runner.temp }}/aiter-site-check
          retention-days: 7
          if-no-files-found: warn

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation
          path: ${{ runner.temp }}/aiter-site
          retention-days: 7
          if-no-files-found: error

      - name: Package the checked website for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/aiter-site

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/docs-website' || github.ref == 'refs/heads/akaratza_aiter_implementation')

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
