name: Actionlint

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/workflow-sources/**"
      - ".github/actions/**"
      - "ci/workflows/**"
      - "ci/pipelines/workflows.py"
      - "tests/unit/ci/test_workflow_inventory.py"
      - "tests/unit/ci/test_workflow_layout.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/workflow-sources/**"
      - ".github/actions/**"
      - "ci/workflows/**"
      - "ci/pipelines/workflows.py"
      - "tests/unit/ci/test_workflow_inventory.py"
      - "tests/unit/ci/test_workflow_layout.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Check GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify generated workflow entrypoints
        uses: ./.github/actions/common/validate-workflows

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint

      - name: Run actionlint
        run: ./actionlint -color -shellcheck "" -pyflakes ""
