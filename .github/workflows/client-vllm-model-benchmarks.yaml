name: Measure a pinned model on the current ROCm vLLM nightly

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Rolling installation evidence is advisory and never advances a supported channel.
jobs:
  build:
    uses: ./.github/workflows/release-build-wheels.yaml
    with:
      release_type: none
      docker_image_py310: ${{ vars.AITER_VLLM_NIGHTLY_EXECUTOR }}
      docker_image_py312: ${{ vars.AITER_VLLM_NIGHTLY_EXECUTOR }}
      build_py310: false
      build_py312: true
      gpu_archs: gfx950
      runner: build-only-aiter
      add_date_stamp: true

  benchmark:
    needs: build
    runs-on: linux-aiter-do-mi350x-8
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}/control
    defaults:
      run:
        working-directory: control
    steps:
      - name: Checkout immutable reviewed controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Checkout candidate source identity
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: candidate
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: aiter-whl-packages-py3.12*
          path: dist
          merge-multiple: true
      - name: Install the nightly, gate imports and measure the declared real model
        env:
          EXECUTOR_IMAGE: ${{ vars.AITER_VLLM_NIGHTLY_EXECUTOR }}
        run: |
          python3 -m ci.pipelines vllm-benchmark \
            --source "$GITHUB_WORKSPACE/candidate" --controls "$GITHUB_WORKSPACE/control" \
            --wheel-dir "$GITHUB_WORKSPACE/dist" --output "$RUNNER_TEMP/vllm-model-benchmark" \
            --image "$EXECUTOR_IMAGE" --gpus 0
      - name: Retain installation failures and every raw model measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vllm-real-model-measurement
          path: |
            ${{ runner.temp }}/vllm-model-benchmark
            !${{ runner.temp }}/vllm-model-benchmark/**/cache/**
            !${{ runner.temp }}/vllm-model-benchmark/**/suite/**
          retention-days: 90
          if-no-files-found: error
