name: AITER Release Automation

on:
  workflow_call:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish. Empty creates the next scheduled tag from main, for example v0.1.20 -> v0.1.21.'
        required: false
        type: string
      release_branch:
        description: 'Release branch to validate or create. Empty uses release/<base-tag>, for example release/v0.1.20.'
        required: false
        type: string
      release_ref:
        description: 'Source ref for a new scheduled release branch/tag when release_tag is empty or missing. Defaults to main.'
        required: false
        type: string
        default: main
      create_missing_refs:
        description: 'Create a missing scheduled release branch/tag from release_ref. Post-release tags must already exist.'
        type: boolean
        default: true
      force_rebuild:
        description: 'Re-run build and qualification for an existing tag. Published releases remain immutable.'
        type: boolean
        default: false
      skip_biweekly_gate:
        description: 'For manual testing only, ignore the every-two-week schedule gate.'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.release_tag || github.ref_name || 'scheduled' }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  prepare:
    name: Prepare release target
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      skip_reason: ${{ steps.resolve.outputs.skip_reason }}
      source_revision: ${{ steps.resolve.outputs.source_revision }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_branch: ${{ steps.resolve.outputs.release_branch }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_kind: ${{ steps.resolve.outputs.release_kind }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      expected_wheel_count: ${{ steps.resolve.outputs.expected_wheel_count }}
    steps:
      - name: Generate release GitHub App token
        id: release_app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AITER_CI_APP_ID }}
          private-key: ${{ secrets.AITER_CI_APP_PRIVATE_KEY }}
          owner: ROCm
          repositories: aiter

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.release_app_token.outputs.token }}
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0

      - name: Resolve release target
        id: resolve
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
          INPUT_RELEASE_BRANCH: ${{ github.event.inputs.release_branch || '' }}
          INPUT_RELEASE_REF: ${{ github.event.inputs.release_ref || 'main' }}
          CREATE_MISSING_REFS: ${{ github.event.inputs.create_missing_refs || true }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || false }}
          SKIP_BIWEEKLY_GATE: ${{ github.event.inputs.skip_biweekly_gate || false }}
          EXPECTED_WHEEL_COUNT: '6'
          RELEASE_CADENCE_ANCHOR: '2026-08-31'
        run: bash ci/release/resolve-stable.sh

  build:
    name: Build release wheels
    needs: prepare
    if: ${{ needs.prepare.outputs.should_run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        rocm_version:
          - '7.0'
          - '7.1'
          - '7.2'
    uses: ./.github/workflows/release-build-wheels.yaml
    with:
      release_type: none
      docker_image_py310: pytorch/manylinux2_28-builder:rocm${{ matrix.rocm_version }}
      docker_image_py312: pytorch/manylinux2_28-builder:rocm${{ matrix.rocm_version }}
      build_py310: true
      build_py312: true
      gpu_archs: 'gfx942;gfx950'
      runner: build-only-aiter
      add_date_stamp: false
      use_manylinux: true
      docker_login: false
      commit: ${{ needs.prepare.outputs.release_tag }}
      artifact_suffix: rocm${{ matrix.rocm_version }}
    permissions:
      contents: read
      actions: read

  qualification-plan:
    name: Freeze release support requirements
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: aiter-whl-packages-py*
          path: dist
          merge-multiple: true
      - name: Resolve pinned executor images and exact wheel cells
        id: plan
        env:
          AITER_SUPPORT_PROFILES: ${{ vars.AITER_SUPPORT_PROFILES }}
        run: python3 -m ci.release.matrix --wheel-dir dist --output "$RUNNER_TEMP/release-matrix.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-qualification-matrix
          path: ${{ runner.temp }}/release-matrix.json
          if-no-files-found: error

  qualify:
    name: Qualify release support cells
    needs: qualification-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.qualification-plan.outputs.matrix) }}
    uses: ./.github/workflows/reusable-run-profile.yaml
    with:
      mode: wheel
      wheel: ${{ matrix.wheel }}
      architecture: ${{ matrix.architecture }}
      profile: ${{ matrix.profile }}
      image: ${{ matrix.image }}
      environment_lock: ${{ matrix.environment_lock }}
      runner: ${{ matrix.runner }}
      gpus: ${{ matrix.gpus }}
      label: ${{ matrix.label }}
      source_revision: ${{ matrix.source_revision }}
    permissions:
      contents: read
      actions: read

  release-record:
    name: Verify the complete wheel release before composing images
    needs: [prepare, qualification-plan, qualify]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: aiter-whl-packages-py*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-qualification-matrix
          path: ${{ runner.temp }}/release-matrix
      - uses: actions/download-artifact@v4
        with:
          pattern: support-evidence-*
          path: ${{ runner.temp }}/support-evidence
      - name: Verify artifact-bound support and client cells
        run: >-
          python3 -m ci.release.stable record --wheels dist
          --matrix "$RUNNER_TEMP/release-matrix/release-matrix.json"
          --runs "$RUNNER_TEMP/support-evidence"
          --output "$RUNNER_TEMP/release.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-release-record
          path: ${{ runner.temp }}/release.json
          if-no-files-found: error

  images:
    needs: release-record
    uses: ./.github/workflows/release-images.yaml
    with:
      qualification_artifact: stable-release-record
      publish: ${{ github.repository_owner == 'ROCm' }}
    permissions:
      contents: read
      actions: read
      packages: write

  publish:
    name: Publish GitHub Release assets
    needs:
      - prepare
      - build
      - qualify
      - images
    if: ${{ needs.prepare.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      RELEASE_KIND: ${{ needs.prepare.outputs.release_kind }}
      RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
      EXPECTED_WHEEL_COUNT: ${{ needs.prepare.outputs.expected_wheel_count }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Download qualification matrix
        uses: actions/download-artifact@v4
        with:
          name: release-qualification-matrix
          path: ${{ runner.temp }}/release-matrix
      - name: Download all product and client evidence
        uses: actions/download-artifact@v4
        with:
          pattern: support-evidence-*
          path: ${{ runner.temp }}/support-evidence
      - uses: actions/download-artifact@v4
        with:
          name: stable-release-record
          path: ${{ runner.temp }}/original-release
      - name: Download OCI publication records
        uses: actions/download-artifact@v4
        with:
          pattern: image-publication-*
          path: release-images
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: aiter-whl-packages-py*
          path: release-wheels
          merge-multiple: true

      - name: Reconstruct qualification, resume verified draft and publish complete asset set
        run: >-
          python3 -m ci.release.stable publish --wheels release-wheels
          --matrix "$RUNNER_TEMP/release-matrix/release-matrix.json"
          --runs "$RUNNER_TEMP/support-evidence"
          --original "$RUNNER_TEMP/original-release/release.json"
          --images release-images

  channels:
    if: always() && !(needs.prepare.result == 'success' && needs.prepare.outputs.should_run == 'false')
    needs: [prepare, build, qualification-plan, qualify, release-record, images, publish]
    uses: ./.github/workflows/release-channels.yaml
    with:
      source_revision: ${{ needs.prepare.outputs.source_revision || github.sha }}
      job_results: ${{ toJSON(needs) }}
      cadence: stable
      publish: ${{ github.repository_owner == 'ROCm' }}
    permissions:
      contents: read
      actions: read
      id-token: write
