name: Run a declared product area

on:
  workflow_call:
    inputs:
      area:
        type: string
        required: true
      runner:
        type: string
        required: true
      image:
        type: string
        required: true
      wheel_artifact:
        type: string
        required: true
      triton_artifact:
        type: string
        required: true
      shard_index:
        type: number
        default: 0
      shard_count:
        type: number
        default: 8
      artifact_name:
        type: string
        required: true
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  execute:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    steps:
      - name: Checkout reviewed product test instructions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Checkout the candidate AITER version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          submodules: recursive
          persist-credentials: false
      - name: Download the candidate wheel
        id: wheel
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.wheel_artifact }}
          path: artifacts/aiter_wheels
      - name: Retry the candidate wheel download
        if: steps.wheel.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.wheel_artifact }}
          path: artifacts/aiter_wheels
      - name: Download reviewed shard lists
        if: inputs.area == 'standard'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aiter_shards
          path: artifacts/shards
      - name: Download the Triton wheel when available
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.triton_artifact }}
          path: artifacts/triton_wheels
      - name: Registry credentials for a trusted job
        if: ${{ !github.event.pull_request || !github.event.pull_request.head.repo.fork }}
        env:
          DOCKER_USERNAME: ${{ secrets.registry_username }}
          DOCKER_PASSWORD: ${{ secrets.registry_password }}
        run: |
          for attempt in 1 2 3; do
            if echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin; then exit 0; fi
            if [ "$attempt" != 3 ]; then sleep 10; fi
          done
          echo 'Registry login unavailable; public image resolution will still be attempted.'
      - name: Bootstrap the selected product area
        working-directory: control
        env:
          PYTHONPATH: ${{ github.workspace }}/control
          PIPELINE_OPERATION: product-legacy
          PIPELINE_PROFILE: ${{ inputs.area }}
          PIPELINE_IMAGE: ${{ inputs.image }}
          PIPELINE_ARTIFACTS: ${{ github.workspace }}/artifacts
          PIPELINE_SHARD_INDEX: ${{ inputs.shard_index }}
          PIPELINE_SHARD_COUNT: ${{ inputs.shard_count }}
        run: python3 -S -m ci.pipelines.bootstrap
      - name: Retain exact selectors, installation and driver results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ${{ runner.temp }}/qualification
            !${{ runner.temp }}/qualification/cache/**
            !${{ runner.temp }}/qualification/suite/**
          retention-days: 7
          if-no-files-found: error
      - name: Drop registry credentials
        if: always()
        run: docker logout || true
