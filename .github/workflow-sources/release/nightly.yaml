name: Nightly delivery

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      docker_image:
        description: 'Docker image for build'
        type: string
        required: false
      python_version:
        description: 'Python version, e.g. 3.10, 3.12, 3.13 (default: builds both 3.10 and 3.12)'
        type: string
        required: false
      gpu_archs:
        description: 'GPU architectures (default: gfx942;gfx950)'
        type: string
        required: false
      skip_tests:
        description: 'Build candidate artifacts only; publication remains blocked'
        type: boolean
        default: false
      skip_promote:
        description: 'Skip promote job (build + test only)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  build:
    uses: ./.github/workflows/release-build-wheels.yaml
    with:
      release_type: ${{ github.event_name == 'schedule' && 'nightlies' || github.event_name == 'pull_request' && 'nightlies' || 'devreleases' }}
      docker_image_py310: ${{ github.event.inputs.docker_image || 'rocm/pytorch:rocm7.2_ubuntu22.04_py3.10_pytorch_release_2.9.1' }}
      docker_image_py312: ${{ github.event.inputs.docker_image || 'rocm/pytorch:rocm7.2_ubuntu24.04_py3.12_pytorch_release_2.9.1' }}
      build_py310: ${{ github.event.inputs.python_version == '' || github.event.inputs.python_version == '3.10' }}
      build_py312: ${{ github.event.inputs.python_version == '' || github.event.inputs.python_version == '3.12' }}
      gpu_archs: ${{ github.event.inputs.gpu_archs || 'gfx942;gfx950' }}
      runner: build-only-aiter
      add_date_stamp: true
    permissions:
      contents: read
      actions: read

  qualification-plan:
    needs: build
    if: ${{ !(inputs.skip_tests || false) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: aiter-whl-packages-py*
          path: dist
          merge-multiple: true
      - id: plan
        env:
          AITER_SUPPORT_PROFILES: ${{ vars.AITER_SUPPORT_PROFILES }}
        run: python3 -m ci.release.matrix --channel nightly --wheel-dir dist --output "$RUNNER_TEMP/release-matrix.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-qualification-matrix
          path: ${{ runner.temp }}/release-matrix.json
          if-no-files-found: error

  qualify:
    needs: qualification-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.qualification-plan.outputs.matrix) }}
    uses: ./.github/workflows/reusable-run-profile.yaml
    with:
      mode: wheel
      wheel: ${{ matrix.wheel }}
      architecture: ${{ matrix.architecture }}
      profile: ${{ matrix.profile }}
      image: ${{ matrix.image }}
      environment_lock: ${{ matrix.environment_lock }}
      runner: ${{ matrix.runner }}
      gpus: ${{ matrix.gpus }}
      label: ${{ matrix.label }}
      source_revision: ${{ matrix.source_revision }}
    permissions:
      contents: read
      actions: read

  release-record:
    needs: [qualification-plan, qualify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: aiter-whl-packages-py*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-qualification-matrix
          path: ${{ runner.temp }}/release-matrix
      - uses: actions/download-artifact@v4
        with:
          pattern: support-evidence-*
          path: ${{ runner.temp }}/support-evidence
      - name: Reconstruct all required installed product and client qualifications
        run: |
          python3 - <<'PYRELEASE'
          import os
          from pathlib import Path
          from ci.common.json import load_json, write_json
          from ci.qualification.catalog import load_catalog
          from ci.release.manifest import release_manifest
          root = Path(os.environ['RUNNER_TEMP'])
          matrix = load_json(root / 'release-matrix/release-matrix.json')['include']
          record = release_manifest(Path('dist'), sorted((root / 'support-evidence').glob('support-evidence-*/run')),
              channel='nightly-tested', notes='Nightly installed product and framework bridge qualification. Exact supported scope and architecture exclusions are recorded below; no full-model certification is implied.',
              required_cells=[item['cell'] for item in matrix], required_environments={item['cell']:item['environment_lock_digest'] for item in matrix}, catalog=load_catalog())
          write_json(root / 'release.json', record)
          PYRELEASE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-release-record
          path: ${{ runner.temp }}/release.json
          if-no-files-found: error

  images:
    needs: release-record
    uses: ./.github/workflows/release-images.yaml
    with:
      qualification_artifact: nightly-release-record
      publish: ${{ github.repository_owner == 'ROCm' && !(inputs.skip_promote || false) }}
    permissions:
      contents: read
      actions: read
      packages: write

  promote:
    needs: [build, qualify, release-record, images]
    if: ${{ github.repository_owner == 'ROCm' && !(inputs.skip_promote || false) }}
    uses: ./.github/workflows/release-promote.yaml
    with:
      release_type: ${{ github.event_name == 'schedule' && 'nightlies' || 'devreleases' }}
      wheel_names: ${{ needs.build.outputs.wheel_names }}
    permissions:
      id-token: write
      contents: read
      actions: read

  channels:
    if: always()
    needs: [build, qualification-plan, qualify, release-record, images, promote]
    uses: ./.github/workflows/release-channels.yaml
    with:
      source_revision: ${{ github.sha }}
      job_results: ${{ toJSON(needs) }}
      cadence: nightly
      publish: ${{ github.repository_owner == 'ROCm' && !(inputs.skip_promote || false) }}
    permissions:
      contents: read
      actions: read
      id-token: write
