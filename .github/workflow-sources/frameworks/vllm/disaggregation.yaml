name: vLLM disaggregated serving

on:
  workflow_call:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      disagg_scripts_stage:
        description: Shared log path visible to Spur login and compute nodes
        type: string
        default: /data/xinhuang/vllm-disagg-logs/
      spur_node_pool:
        description: Comma-separated eligible Slurm nodes; workloads need two or four
        type: string
        default: ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-5,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-6,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-7,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-8,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-13,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-15,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-16
      image:
        description: Optional immutable image override; the reviewed image is in selection.json
        type: string
        default: ''

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIPELINE_OPERATION: vllm-disaggregation
  BASE_IMAGE: ${{ inputs.image || '' }}
  AITER_WHEEL_ARTIFACT_NAME: aiter-vllm-disagg-wheel-${{ github.run_id }}

jobs:
  ci_config:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'ci:vllm-di'))
    uses: ./.github/workflows/repository-legacy-config.yaml

  build_aiter_wheel:
    name: Build targeted gfx950 overlay wheels
    needs: ci_config
    runs-on: build-only-aiter
    env:
      PYTHONPATH: ${{ github.workspace }}/control
    steps:
      - name: Checkout reviewed controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Checkout candidate AITER
        uses: actions/checkout@v4
        with:
          path: candidate
          submodules: recursive
          persist-credentials: false
      - name: Docker login
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        env:
          DOCKER_USERNAME: ${{ secrets[needs.ci_config.outputs.docker_username_secret] }}
          DOCKER_PASSWORD: ${{ secrets[needs.ci_config.outputs.docker_password_secret] }}
        run: |
          for attempt in 1 2 3; do
            if printf '%s' "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin; then
              exit 0
            fi
            sleep 10
          done
          echo 'Optional Docker login failed; the pinned public image will still be requested.'
      - name: Bootstrap wheel build
        working-directory: control
        env:
          PIPELINE_PHASE: build
        run: python3 -m ci.pipelines.bootstrap --output "$RUNNER_TEMP/disaggregation-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Upload overlay wheels
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AITER_WHEEL_ARTIFACT_NAME }}
          path: |
            candidate/dist/*.whl
            candidate/.aiter-build.log
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vllm-disaggregation-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/disaggregation-build-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn

  select_vllm_cases:
    name: Select reviewed model and topology areas
    needs: ci_config
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    env:
      PYTHONPATH: ${{ github.workspace }}/control
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Checkout pinned upstream workload definitions
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          # Must match ci/clients/vllm/disaggregation/selection.json.
          ref: a42850c85f815ab3123a541bc92fb9b35892335e
          path: vllm
          persist-credentials: false
      - name: Bootstrap selection
        id: select
        working-directory: control
        env:
          PIPELINE_PHASE: select
        run: python3 -m ci.pipelines.bootstrap --source "$GITHUB_WORKSPACE/vllm" --output "$RUNNER_TEMP/disaggregation-selection-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vllm-disaggregation-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/disaggregation-selection-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn

  vllm-disagg-smoke:
    name: ${{ matrix.case_name }}
    needs: [build_aiter_wheel, select_vllm_cases]
    runs-on: [self-hosted, aiter-di-ci-spur-login-vllm]
    timeout-minutes: 600
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.select_vllm_cases.outputs.matrix) }}
    env:
      PYTHONPATH: ${{ github.workspace }}/control
      HF_TOKEN: ${{ secrets.HF_TOKEN_TEST }}
      CASE_SLUG: ${{ matrix.case_slug }}
      DISAGG_SCRIPTS_STAGE: ${{ inputs.disagg_scripts_stage || '/data/xinhuang/vllm-disagg-logs/' }}
      SPUR_NODE_POOL: ${{ inputs.spur_node_pool || 'ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-5,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-6,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-7,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-8,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-13,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-15,ml-ai-ubuntu-gpu-mi350x8-2304gb-fabric-16' }}
      DISAGG_EVIDENCE_NAME: vllm-disaggregation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.case_slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Checkout pinned upstream client
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: a42850c85f815ab3123a541bc92fb9b35892335e
          path: vllm
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.AITER_WHEEL_ARTIFACT_NAME }}
          path: aiter_wheels/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.case_slug }}
      - name: Bootstrap cluster workload
        working-directory: control
        env:
          PIPELINE_PHASE: run
        run: python3 -m ci.pipelines.bootstrap --source "$GITHUB_WORKSPACE/vllm" --output "$RUNNER_TEMP/$DISAGG_EVIDENCE_NAME/run"
      - name: Collect submitted job and accuracy evidence
        if: always()
        working-directory: control
        env:
          PIPELINE_PHASE: collect
        run: python3 -m ci.pipelines.bootstrap --source "$GITHUB_WORKSPACE/vllm" --output "$RUNNER_TEMP/$DISAGG_EVIDENCE_NAME/collect"
      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vllm-disagg-${{ matrix.case_slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.DISAGG_EVIDENCE_NAME }}/
          if-no-files-found: warn
          retention-days: 7
