name: Sglang Downstream Test

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]  # Triggers on PRs targeting `main`
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci_config:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'ci:sglang') ||
      contains(github.event.pull_request.labels.*.name, 'ci:all')))
    uses: ./.github/workflows/repository-legacy-config.yaml

  check-signal:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'ci:sglang') ||
      contains(github.event.pull_request.labels.*.name, 'ci:all')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Checks workflow
        run: ./.github/scripts/common/check_signal.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}

  select-sglang-tests:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'ci:sglang') ||
      contains(github.event.pull_request.labels.*.name, 'ci:all')))
    needs: [check-signal]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_tests: ${{ steps.select.outputs.has_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select SGLang tests
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 -m ci.clients.sglang.downstream select-tests

  sglang:
    if: needs.select-sglang-tests.outputs.has_tests == 'true'
    name: Sglang ${{ matrix.model }} ${{ matrix.test_type }} (8 GPU)
    needs: [check-signal, select-sglang-tests, ci_config]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select-sglang-tests.outputs.matrix) }}

    steps:
      - name: Checkout reviewed SGLang platform controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: control

      - name: Checkout the candidate AITER version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          submodules: recursive
          persist-credentials: false

      - name: Docker login
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        env:
          DOCKER_USERNAME: ${{ secrets[needs.ci_config.outputs.docker_username_secret] }}
          DOCKER_PASSWORD: ${{ secrets[needs.ci_config.outputs.docker_password_secret] }}
        run: |
          for attempt in 1 2 3; do
            if echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin; then
              echo "Docker login succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Docker login attempt ${attempt} failed"
            if [ "${attempt}" != 3 ]; then
              sleep 10
            fi
          done
          echo "Docker login failed after 3 attempts, continuing anyway"
          exit 0

      - name: Bootstrap the declared SGLang platform and model case
        env:
          PYTHONPATH: ${{ github.workspace }}/control
          PIPELINE_OPERATION: sglang-downstream
          PIPELINE_CASE: ${{ toJson(matrix) }}
          HF_TOKEN: ${{ secrets.HF_TOKEN_TEST }}
        working-directory: control
        run: python3 -S -m ci.pipelines.bootstrap --output "$RUNNER_TEMP/sglang-model-canary"

      - name: Retain platform, import and model evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sglang-model-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/sglang-model-canary
            !${{ runner.temp }}/sglang-model-canary/sglang/**
          if-no-files-found: error
          retention-days: 14

      - name: Drop registry credentials
        if: always()
        run: docker logout || true
